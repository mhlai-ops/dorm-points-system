<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1769c2" />
    <meta name="description" content="晨樂加油站：為小朋友設計的積分加油站，記錄每天的好表現。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>晨樂加油站｜小朋友積分管理</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById("root");
        var shown = false;
        function showFallback(message) {
          if (shown || !root) return;
          shown = true;
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff9e8;color:#17324d;font-family:Nunito,Arial,sans-serif;text-align:center"><section style="max-width:420px;background:#fff;border:3px solid #1769c2;border-radius:24px;padding:28px;box-shadow:0 10px 0 #ffd447"><div style="font-size:48px;margin-bottom:8px">☀️</div><h1 style="margin:0 0 10px;font-size:26px">晨樂加油站暫時未能開啟</h1><p style="margin:0 0 18px;line-height:1.7">請重新整理頁面；如果問題持續，請清除此網站的快取後再試。</p><button onclick="location.reload()" style="border:0;border-radius:999px;background:#1769c2;color:#fff;padding:13px 22px;font:800 16px Nunito,Arial,sans-serif;cursor:pointer">重新整理</button></section></main>';
          if (window.console && console.error) console.error("晨樂加油站初始化錯誤", message);
        }
        window.addEventListener("error", function (event) {
          var target = event && event.target;
          if (target && target.tagName && (target.tagName === "IMG" || target.tagName === "LINK")) return;
          showFallback(event && event.error ? event.error.message : "資源或初始化錯誤");
        });
        window.addEventListener("unhandledrejection", function (event) {
          showFallback(event && event.reason ? String(event.reason) : "未處理的 Promise 錯誤");
        });
        window.__showMorningJoyFallback = showFallback;
      })();
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__showMorningJoyFallback && window.__showMorningJoyFallback('無法載入 App JavaScript')"></script>
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (endpoint && websiteId && endpoint.indexOf("%VITE_") !== 0) {
          var script = document.createElement("script");
          script.defer = true;
          script.src = endpoint.replace(/\/$/, "") + "/umami";
          script.dataset.websiteId = websiteId;
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
